<style>
  :root {
    --ink: #0a0a0a;
    --paper: #f7f5f0;
    --line: #d8d4ca;
    --mute: #6b6b66;
    --accent: #0a0a0a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }
  .serif { font-family: "Fraunces", "Times New Roman", serif; font-optical-sizing: auto; font-variation-settings: "SOFT" 30, "WONK" 0; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  ::selection { background: var(--ink); color: var(--paper); }

  /* tweaks panel polish */
  .tweaks-host { font-family: "Inter", sans-serif; }

  /* ── Responsive nav ── */
  .nav-links { display: flex; gap: 28px; align-items: center; }
  .hamburger-btn { display: none; flex-direction: column; gap: 5px; background: none; border: 0; cursor: pointer; padding: 6px; }
  .ham-line { display: block; width: 22px; height: 1.5px; background: #fff; transition: transform 0.25s ease, opacity 0.2s ease; transform-origin: center; }

  /* ── Mobile full-screen menu ── */
  .mobile-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: flex; flex-direction: column; justify-content: center;
    padding: 40px;
    animation: overlayFadeIn 0.2s ease;
  }
  .mobile-close-btn {
    position: absolute; top: 14px; right: 24px;
    display: flex; flex-direction: column; gap: 5px;
    background: none; border: 0; cursor: pointer; padding: 6px;
  }
  .menu-stagger-link {
    font-family: "Archivo Black", "Helvetica Neue", sans-serif;
    font-size: clamp(42px, 14vw, 72px);
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    display: block;
    line-height: 1.15;
    animation: menuItemIn 0.4s ease both;
    transition: color 0.15s;
  }
  .menu-stagger-link:hover { color: rgba(255,255,255,0.45); }
  .menu-stagger-date {
    margin-top: 48px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    animation: menuItemIn 0.4s ease both;
  }

  @keyframes overlayFadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes menuItemIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 767px) {
    .nav-links { display: none !important; }
    .hamburger-btn { display: flex; }
  }

  /* ── Video section ── */
  .video-card {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 64px;
    align-items: start;
    padding: 56px 0;
    max-width: 1100px;
    margin: 0 auto;
  }
  .video-player {
    width: 320px; height: calc(320px * 16 / 9);
    overflow: hidden; background: #111;
    position: relative; cursor: pointer; flex-shrink: 0;
  }
  .video-desc { padding-top: 12px; }
  @media (max-width: 860px) {
    .video-card { grid-template-columns: 260px 1fr; gap: 40px; }
    .video-player { width: 260px; height: calc(260px * 16 / 9); }
  }
  @media (max-width: 640px) {
    .video-card { grid-template-columns: 1fr; gap: 20px; padding: 40px 0; }
    .video-player { width: 100%; height: auto; aspect-ratio: 9 / 16; }
    .video-desc { padding-top: 0; }
  }
</style>
